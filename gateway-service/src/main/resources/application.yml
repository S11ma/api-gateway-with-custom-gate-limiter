server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: order-service-route
          uri: http://localhost:8081
          predicates:
            - Path=/orders/**

        - id: product-service-route
          uri: http://localhost:8082
          predicates:
            - Path=/products/**

management:
  endpoints:
    web:
      exposure:
        include: gateway,health,info

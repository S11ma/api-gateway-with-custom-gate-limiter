server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: auth-service-route
          uri: http://localhost:8083
          predicates:
            - Path=/auth/**

        - id: order-service-route
          uri: http://localhost:8081
          predicates:
            - Path=/orders/**

        - id: product-service-route
          uri: http://localhost:8082
          predicates:
            - Path=/products/**
  data:
    redis:
          host: localhost
          port: 6379

management:
  endpoints:
    web:
      exposure:
        include: gateway,health,info,metrics,gatewaystats

# Must match auth-service/application.yml exactly - both services sign/
# verify JWTs with this same HMAC key.
jwt:
  secret: LihuJumIzQKtnoQfCNyxmZ00fDFsbFzib5MTAV771F8=

api:
  keys:
    mobile-app-key-123: mobile-app
    partner-x-key-456: partner-x

blacklist:
  ips: []
  api-keys: []

# Fixed window rate limiter (Stage 5). Key = username:client, e.g.
# "seema:mobile-app". Low limit here on purpose, for easy testing -
# raise it once you've confirmed the 429 behavior works.

# Rate limiter - strategy switches which RateLimiter bean is active via
# @ConditionalOnProperty, no code changes needed to swap algorithms:
#   memory       -> Stage 5, in-memory fixed window
#   redis        -> Stage 6, Redis-backed fixed window (distributed)
#   sliding      -> Stage 7, Redis sliding window counter
#   token-bucket -> Stage 8, Redis token bucket
rate-limit:
  strategy: token-bucket
  max-requests: 5
  window-seconds: 60

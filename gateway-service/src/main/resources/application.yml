server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: auth-service-route
          uri: http://localhost:8083
          predicates:
            - Path=/auth/**

        - id: order-service-route
          uri: http://localhost:8081
          predicates:
            - Path=/orders/**

        - id: product-service-route
          uri: http://localhost:8082
          predicates:
            - Path=/products/**

management:
  endpoints:
    web:
      exposure:
        include: gateway,health,info

# Must match auth-service/application.yml exactly - both services sign/
# verify JWTs with this same HMAC key.
jwt:
  secret: 8C+847MpsW3qHYF/6/7hrFPyxYwRuMzzbkoWVDUq1DE=

api:
